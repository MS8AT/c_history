<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WorkBooth — сказка о внимательной системе</title>
  <desc id="desc">Светящийся путь соединяет звёздный AI-контур с окном Dashboard.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.48" stop-color="#121b43"/>
      <stop offset="1" stop-color="#083947"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8f7cff"/>
      <stop offset="0.5" stop-color="#6fe9ff"/>
      <stop offset="1" stop-color="#8fffc7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#bdfbff" stop-opacity=".88"/>
      <stop offset="1" stop-color="#69dbff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#night)"/>
  <g fill="#fff">
    <circle cx="120" cy="138" r="3" opacity=".8"/><circle cx="245" cy="84" r="2" opacity=".55"/>
    <circle cx="388" cy="176" r="4" opacity=".7"/><circle cx="612" cy="94" r="2" opacity=".8"/>
    <circle cx="815" cy="146" r="3" opacity=".46"/><circle cx="1035" cy="82" r="4" opacity=".7"/>
    <circle cx="1288" cy="156" r="2" opacity=".72"/><circle cx="1480" cy="96" r="3" opacity=".5"/>
    <circle cx="1435" cy="405" r="3" opacity=".72"/><circle cx="1160" cy="328" r="2" opacity=".5"/>
    <circle cx="217" cy="520" r="2" opacity=".62"/><circle cx="520" cy="455" r="3" opacity=".45"/>
  </g>
  <circle cx="1250" cy="470" r="265" fill="url(#glow)" filter="url(#blur)" opacity=".42"/>
  <path d="M150 700 C430 610 470 720 720 590 S1050 360 1390 430" fill="none" stroke="url(#path)" stroke-width="6" stroke-linecap="round" opacity=".82"/>
  <path d="M150 700 C430 610 470 720 720 590 S1050 360 1390 430" fill="none" stroke="#bffcff" stroke-width="24" stroke-linecap="round" opacity=".08" filter="url(#blur)"/>
  <g transform="translate(1040 245)">
    <rect width="390" height="310" rx="28" fill="#0b1733" stroke="#9df7ff" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="34" cy="34" r="6" fill="#8fffc7"/><circle cx="56" cy="34" r="6" fill="#6fe9ff" opacity=".6"/>
    <rect x="30" y="72" width="135" height="18" rx="9" fill="#edfaff" opacity=".86"/>
    <rect x="30" y="106" width="210" height="10" rx="5" fill="#edfaff" opacity=".24"/>
    <rect x="30" y="144" width="152" height="112" rx="18" fill="#6fe9ff" opacity=".12" stroke="#6fe9ff"/>
    <path d="M53 220 L84 194 108 207 151 167" fill="none" stroke="#8fffc7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="204" y="144" width="155" height="50" rx="16" fill="#8f7cff" opacity=".2" stroke="#ae9fff"/>
    <rect x="204" y="206" width="155" height="50" rx="16" fill="#8fffc7" opacity=".14" stroke="#8fffc7"/>
  </g>
  <g transform="translate(120 160)">
    <rect width="76" height="76" rx="19" fill="#fff"/>
    <text x="38" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="53" fill="#101018">W</text>
    <text x="98" y="39" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">WorkBooth</text>
    <text x="98" y="66" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#8fffc7">A HUMAN STORY</text>
  </g>
  <text x="120" y="350" font-family="Georgia, serif" font-size="75" font-weight="700" fill="#fff">Там, где данные</text>
  <text x="120" y="435" font-family="Georgia, serif" font-size="75" font-weight="700" fill="#fff">становятся светом</text>
  <text x="124" y="492" font-family="Arial, sans-serif" font-size="25" fill="#cfe7ee">Сказка о внимательной системе, AI-контуре и окне Dashboard</text>
</svg>
